name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests (Jest)
        run: npm run test:unit

  e2e:
    if: ${{ env.E2E_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e

  accessibility:
    if: ${{ env.A11Y_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      A11Y_BASE_URL: ${{ vars.A11Y_BASE_URL || secrets.A11Y_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Pa11y checks
        run: npm run test:a11y
